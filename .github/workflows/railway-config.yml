name: Railway config

# Keeps staging's Railway settings in step with .railway/railway.ts.
# A pull request that changes the file shows the plan; merging applies it.
# Production is applied by the release workflow instead, after approval.
on:
  pull_request:
    paths: ['.railway/**', '.github/workflows/railway-config.yml']
  push:
    branches: [main]
    paths: ['.railway/**', '.github/workflows/railway-config.yml']

permissions:
  contents: read

concurrency:
  group: railway-config-staging
  cancel-in-progress: false

# The project token is scoped to staging, so the CLI needs no --environment
# (naming one makes the CLI look it up, which a project token cannot do).
env:
  RAILWAY_CLI_VERSION: 5.74.0

jobs:
  plan:
    name: plan (staging)
    # Fork pull requests get no secrets, so there is nothing to plan with.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
    steps:
      - name: Check the staging token is set
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::The RAILWAY_STAGING_TOKEN repository secret is not set. See docs/deployment.md, GitHub step 2."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm install --global "@railway/cli@$RAILWAY_CLI_VERSION"
      - name: Diagnose plan (temporary)
        run: |
          mkdir -p .railway/diag
          base='.railway/railway.ts'
          # A: no partial export
          grep -v '^export const partial' "$base" > .railway/diag/a.ts
          # B: no project variables block
          python3 - <<'PY'
          import re
          s=open('.railway/railway.ts').read()
          s=re.sub(r"\s*// Variables.*?\n.*?\n\s*variables: \{ managed: false \},", "", s, flags=re.S)
          open('.railway/diag/b.ts','w').write(s)
          s2=s.replace("export const partial = 'groove-loom';","")
          open('.railway/diag/c.ts','w').write(s2)
          PY
          cat > .railway/diag/d.ts <<'TS'
          import { defineRailway, project, service } from 'railway/iac';
          export default defineRailway(() => project('sweet-charisma', { resources: [service('groove-loom', { start: 'npm start' })] }));
          TS
          for f in a b c d; do
            echo "=== $f"; grep -c partial .railway/diag/$f.ts || true; grep -c 'managed: false' .railway/diag/$f.ts || true
            railway config plan --file .railway/diag/$f.ts 2>&1 | tail -6 || true
          done
          rm -rf .railway/diag
      - name: Plan
        run: |
          set -o pipefail
          railway config plan --verbose | tee plan.txt
          {
            echo '### Railway plan for staging'
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: apply (staging)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
    steps:
      - name: Check the staging token is set
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::The RAILWAY_STAGING_TOKEN repository secret is not set. See docs/deployment.md, GitHub step 2."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm install --global "@railway/cli@$RAILWAY_CLI_VERSION"
      # No --confirm-destructive: a change that would delete something fails
      # here and has to be applied by hand after a look.
      - name: Apply
        run: railway config apply --yes
