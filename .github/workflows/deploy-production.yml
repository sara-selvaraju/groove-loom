name: Deploy production

# Release with: npm version patch && git push --follow-tags
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag must point at a commit on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main."
            exit 1
          fi
      - name: Tag must match the version in package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag is $GITHUB_REF_NAME but package.json says $expected."
            exit 1
          fi

  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml

  deploy:
    name: deploy
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required reviewers on this environment are the approval gate. The
    # Railway token is an environment secret, released only after approval.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install the Railway CLI
        run: npm install --global @railway/cli@5.74.0
      - name: Deploy to Railway
        run: railway up --ci --service "$RAILWAY_SERVICE" --environment production
      - name: Wait for the new version to go live
        run: |
          expected="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 30); do
            live="$(curl -fsS "$PRODUCTION_URL/healthz" | jq -r .version || true)"
            if [ "$live" = "$expected" ]; then
              echo "Production is serving $expected."
              exit 0
            fi
            echo "Attempt $attempt: production reports '${live:-no answer}', waiting for $expected."
            sleep 10
          done
          echo "::error::Production did not report version $expected within 5 minutes."
          exit 1
