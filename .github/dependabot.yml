# Weekly pull requests for outdated or vulnerable dependencies. Security fixes
# arrive as soon as they are published, whatever the schedule. Every update
# runs CI like any other pull request, including the test that fails if
# @strudel/mini drifts from the version @strudel/web is built on.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Tools that only run in development and CI, batched into one pull request.
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (see CLAUDE.md).
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
